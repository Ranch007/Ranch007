name: Metrics
on:
  # Schedule daily updates
  schedule: [{cron: "0 0 * * *"}]
  # (optional) Run workflow manually
  workflow_dispatch:
  # (optional) Run workflow when pushing on master/main
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    environment: 
      name: production
    permissions:
      contents: write
    steps:
      - name: left profile
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.left.svg

          user: Ranch007
          base: ""
          template: classic
          config_timezone: Asia/Shanghai
          
          # Overall issues and pull requests status
          plugin_followup: yes
          plugin_followup_archived: yes
          plugin_followup_sections: repositories
          
          # Most used languages
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_analysis_timeout_repositories: 7.5
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%
          plugin_languages_ignored: html

          # RSS
          plugin_rss: yes
          plugin_rss_source: https://ranch007.github.io/index.xml
          plugin_rss_limit: 3


      - name: right profile
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.right.svg

          user: Ranch007
          template: classic
          base: ""
          config_timezone: Asia/Shanghai

          # Star lists
          plugin_starlists: yes
          plugin_starlists_languages: yes
          plugin_starlists_limit_languages: 6
          plugin_starlists_languages_ignored: html
          plugin_starlists_languages_aliases: Jupyter Notebook:ipynb
          plugin_starlists_limit_repositories: 0

          
          # Contributions calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Fix SVG mask ID collisions
        shell: bash
        run: |
          # ── Fix left SVG: prefix all IDs with "-left" ──
          sed -i 's/id="languages-bar"/id="languages-bar-left"/g' metrics.left.svg
          sed -i 's/#languages-bar)/#languages-bar-left)/g' metrics.left.svg
          sed -i 's/id="issues-bar"/id="issues-bar-left"/g' metrics.left.svg
          sed -i 's/#issues-bar)/#issues-bar-left)/g' metrics.left.svg
          sed -i 's/id="pr-bar"/id="pr-bar-left"/g' metrics.left.svg
          sed -i 's/#pr-bar)/#pr-bar-left)/g' metrics.left.svg
          sed -i 's/id="metrics-end"/id="metrics-end-left"/g' metrics.left.svg

          # ── Fix right SVG: prefix all IDs with "-right" ──
          sed -i 's/id="languages-bar"/id="languages-bar-right"/g' metrics.right.svg
          sed -i 's/#languages-bar)/#languages-bar-right)/g' metrics.right.svg
          sed -i 's/id="brightness1"/id="brightness1-right"/g' metrics.right.svg
          sed -i 's/#brightness1)/#brightness1-right)/g' metrics.right.svg
          sed -i 's/id="brightness2"/id="brightness2-right"/g' metrics.right.svg
          sed -i 's/#brightness2)/#brightness2-right)/g' metrics.right.svg
          sed -i 's/id="metrics-end"/id="metrics-end-right"/g' metrics.right.svg

          # ── Commit fix ──
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add metrics.left.svg metrics.right.svg
          git diff --staged --quiet || (git commit -m "🐛 Fix SVG mask ID collisions" && git push)


